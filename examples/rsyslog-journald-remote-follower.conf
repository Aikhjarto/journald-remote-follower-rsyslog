# rsyslog configuration for journald-remote-follower-rsyslog (example)
#
# imjournal reads the local journal only: with Remote="on" it merges the
# remote journals by time and skips entries that are uploaded late.
module(load="imjournal" Remote="off" StateFile="imjournal.state")
module(load="imrelp")

# the remote journals, in arrival order, and the backfill (no notifications)
input(type="imrelp" address="127.0.0.1" port="2514" ruleset="journal")
input(type="imrelp" address="127.0.0.1" port="2515" ruleset="backfill")

template(name="HostFile" type="string" string="/var/log/hosts/%$.host:::secpath-replace%/messages")
# the same lines as imjournal's: "program[pid]: message"
template(name="JournalFileFormat" type="string"
         string="%TIMESTAMP:::date-rfc3339% %$.host% %$.tag% %msg:::drop-last-lf%\n")

ruleset(name="journal") {
    set $.host = $hostname;
    if $procid == "-" or $procid == "" then set $.tag = $app-name & ":";
    else set $.tag = $app-name & "[" & $procid & "]:";
    action(type="omfile" dynaFile="HostFile" dynaFileCacheSize="100" template="JournalFileFormat")
    # ... and whatever else should see them, e.g. a notifier
}

ruleset(name="backfill") {
    set $.host = $hostname;
    if $procid == "-" or $procid == "" then set $.tag = $app-name & ":";
    else set $.tag = $app-name & "[" & $procid & "]:";
    action(type="omfile" dynaFile="HostFile" dynaFileCacheSize="100" template="JournalFileFormat")
}
